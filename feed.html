<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoSphere - Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-body" onload="initFeed()">

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <header class="navbar">
        <h1 class="logo-title" onclick="window.location.reload()" style="cursor:pointer">📸 PhotoSphere</h1>
        
        <!-- BARRA DE PESQUISA CENTRAL -->
        <input type="text" id="nav-search-input" placeholder="🔍 Pesquisar por nickname...">
        
        <div class="nav-right">
            <!-- BOTÃO DE ESTATÍSTICAS -->
            <button class="add-post-btn" style="background: linear-gradient(135deg, #a855f7, #6366f1);" onclick="openAnalyticsModal()">📊 Estatísticas</button>
            <button class="add-post-btn" onclick="openPublishModal()">➕ Novo Post</button>
            <img id="nav-user-avatar" src="" alt="Perfil" class="nav-avatar">
            <button class="logout-link" onclick="logout()">Sair</button>
        </div>
    </header>

    <!-- TIMELINE DO FEED -->
    <main class="feed-container" id="feed-timeline"></main>

    <!-- POPUP DE PUBLICAÇÃO (MODAL) -->
    <div id="publish-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Criar Nova Publicação</h3>
                <button class="close-modal-btn" onclick="closePublishModal()">✕</button>
            </div>
            <form onsubmit="handlePublish(event)">
                <div class="modal-preview-container">
                    <img id="post-preview" src="" alt="Preview da Foto" style="display:none;">
                    <span id="preview-placeholder" style="color:#6b7280;">Nenhuma foto selecionada</span>
                </div>
                <div class="input-group" style="text-align: center;">
                    <label for="post-file" class="upload-label" style="margin-bottom: 15px;">📁 Escolher Foto</label>
                    <input type="file" id="post-file" accept="image/*" required onchange="previewPostImage(event)">
                </div>
                <div class="input-group">
                    <label>Título / Legenda</label>
                    <input type="text" id="post-title" required placeholder="Escreve uma legenda para a tua foto...">
                </div>
                <button type="submit" class="auth-btn">Publicar Agora</button>
            </form>
        </div>
    </div>

    <!-- POPUP DE ESTATÍSTICAS / ANALYTICS -->
    <div id="analytics-modal" class="modal-overlay">
        <div class="modal-box" style="border-color: #a855f7;">
            <div class="modal-header">
                <h3 style="color: #a855f7;">📊 O Teu Painel de Analytics</h3>
                <button class="close-modal-btn" onclick="closeAnalyticsModal()">✕</button>
            </div>
            <div class="analytics-grid">
                <div class="stat-card">
                    <h4>Publicações</h4>
                    <p id="stat-total-posts">0</p>
                </div>
                <div class="stat-card">
                    <h4>Total de Likes</h4>
                    <p id="stat-total-likes">0</p>
                </div>
                <div class="stat-card">
                    <h4>Média de Likes</h4>
                    <p id="stat-avg-likes">0.0</p>
                </div>
            </div>
            <div class="stat-card" style="margin-top: 15px; text-align: left;">
                <h4>🏆 Maior Sucesso (Legenda):</h4>
                <p id="stat-best-post" style="font-size: 1rem; color: #e2e8f0; font-weight: normal; margin-top: 5px;">A carregar...</p>
            </div>
        </div>
    </div>

    <!-- ASSOCIAÇÃO DE TODOS OS FICHEIROS JAVASCRIPT EXTERNOS -->
    <script src="social.js"></script>
    <script src="search.js"></script>
    <script src="analytics.js"></script>
    <script src="render.js"></script> <!-- Liga a nova lógica de desenho do ecrã -->
    
</body>
</html>
