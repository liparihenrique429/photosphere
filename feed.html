<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoSphere - Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-body" onload="initFeed()">

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <header class="navbar">
        <h1 class="logo-title" onclick="window.location.reload()" style="cursor:pointer">📸 PhotoSphere</h1>
        
        <!-- BARRA DE PESQUISA CENTRAL (NOVA) -->
        <input type="text" id="nav-search-input" placeholder="🔍 Pesquisar por nickname...">
        
        <div class="nav-right">
            <button class="add-post-btn" onclick="openPublishModal()">➕ Novo Post</button>
            <img id="nav-user-avatar" src="" alt="Perfil" class="nav-avatar">
            <button class="logout-link" onclick="logout()">Sair</button>
        </div>
    </header>

    <!-- TIMELINE DO FEED -->
    <main class="feed-container" id="feed-timeline"></main>

    <!-- POPUP DE PUBLICAÇÃO (MODAL) -->
    <div id="publish-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Criar Nova Publicação</h3>
                <button class="close-modal-btn" onclick="closePublishModal()">✕</button>
            </div>
            <form onsubmit="handlePublish(event)">
                <div class="modal-preview-container">
                    <img id="post-preview" src="" alt="Preview da Foto" style="display:none;">
                    <span id="preview-placeholder" style="color:#6b7280;">Nenhuma foto selecionada</span>
                </div>
                <div class="input-group" style="text-align: center;">
                    <label for="post-file" class="upload-label" style="margin-bottom: 15px;">📁 Escolher Foto</label>
                    <input type="file" id="post-file" accept="image/*" required onchange="previewPostImage(event)">
                </div>
                <div class="input-group">
                    <label>Título / Legenda</label>
                    <input type="text" id="post-title" required placeholder="Escreve uma legenda para a tua foto...">
                </div>
                <button type="submit" class="auth-btn">Publicar Agora</button>
            </form>
        </div>
    </div>

    <!-- ASSOCIAÇÃO DOS FICHEIROS JAVASCRIPT EXTERNOS -->
    <script src="social.js"></script>
    <script src="search.js"></script> <!-- Ligação ao sistema de pesquisa -->
    
    <script>
        let currentUser = null;

        function initFeed() {
            const sessionEmail = localStorage.getItem('activeSession');
            if (!sessionEmail) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(localStorage.getItem(sessionEmail));
            
            // Define o avatar do utilizador no canto superior direito
            document.getElementById('nav-user-avatar').src = currentUser.profilePic || "https://dicebear.com" + currentUser.nickname;
            
            renderPosts();

            // Sincroniza em tempo real se existirem várias abas abertas
            window.addEventListener('storage', () => { renderPosts(); });
        }

        function renderPosts() {
            const timeline = document.getElementById('feed-timeline');
            timeline.innerHTML = "";
            const allPosts = getStoragePosts();

            // Verifica se o utilizador logado é o administrador do sistema
            const isAdmin = (currentUser.email === "liparihenrique429@gmail.com");

            allPosts.forEach(post => {
                const hasLiked = post.likes.includes(currentUser.nickname);
                const card = document.createElement('article');
                card.className = 'post-card';
                
                let commentsHTML = post.comments.map(c => `<p class="comment-line"><strong>${c.user}</strong> ${c.text}</p>`).join('');

                // Define se o botão de apagar deve ser exibido (se for dono da foto ou admin)
                let deleteButtonHTML = "";
                if (post.nickname === currentUser.nickname || isAdmin) {
                    deleteButtonHTML = `<button class="delete-post-btn" onclick="deletePost('${post.id}')" title="Eliminar Publicação">🗑️</button>`;
                }

                card.innerHTML = `
                    <div class="post-header-area">
                        <div class="post-user-info">
                            <img src="${post.avatar}" alt="User">
                            <span class="post-username">${post.nickname} ${isAdmin && post.nickname !== currentUser.nickname ? '<span class="admin-tag">(Moderação)</span>' : ''}</span>
                        </div>
                        ${deleteButtonHTML}
                    </div>
                    
                    <div class="post-image-container">
                        <img src="${post.image}" alt="Post">
                    </div>
                    
                    <div class="post-actions-bar">
                        <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}', '${currentUser.nickname}')">
                            ${hasLiked ? '❤️' : '🤍'} ${post.likes.length}
                        </button>
                        <button class="action-btn" onclick="sharePost('${post.id}')">
                            ↩️ Partilhar
                        </button>
                    </div>

                    <div class="post-caption-box">
                        <p><strong>${post.nickname}</strong> ${post.title}</p>
                        <div class="comments-section">${commentsHTML}</div>
                    </div>

                    <form class="comment-form" onsubmit="addComment(event, '${post.id}', '${currentUser.nickname}')">
                        <input type="text" id="input-comment-${post.id}" required placeholder="Adicione um comentário público...">
                        <button type="submit" class="send-comment-btn">Publicar</button>
                    </form>
                `;
                timeline.appendChild(card);
            });

            // Se o utilizador já tiver algo escrito na barra de pesquisa, reaplica o filtro após desenhar os posts
            if (typeof filterFeedBySearch === 'function') {
                filterFeedBySearch();
            }
        }

        function openPublishModal() { document.getElementById('publish-modal').classList.add('active'); }
        
        function closePublishModal() { 
            document.getElementById('publish-modal').classList.remove('active'); 
            document.getElementById('post-preview').style.display = 'none';
            document.getElementById('preview-placeholder').style.display = 'block';
        }

        function previewPostImage(event) {
            const input = event.target;
            if (input.files && input.files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewImg = document.getElementById('post-preview');
                    const placeholder = document.getElementById('preview-placeholder');
                    
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(input.files);
            }
        }

        function handlePublish(event) {
            event.preventDefault();
            const title = document.getElementById('post-title').value.trim();
            const imageSrc = document.getElementById('post-preview').src;

            if (!imageSrc || imageSrc === "" || document.getElementById('post-preview').style.display === 'none') {
                alert("Por favor, selecione uma imagem válida antes de publicar.");
                return;
            }

            const newPost = {
                id: "post_" + Date.now(),
                nickname: currentUser.nickname,
                avatar: currentUser.profilePic || "https://dicebear.com" + currentUser.nickname,
                title: title,
                image: imageSrc,
                likes: [],
                comments: []
            };

            const globalPosts = getStoragePosts();
            globalPosts.unshift(newPost);
            saveStoragePosts(globalPosts);

            closePublishModal();
            event.target.reset();
            renderPosts();
        }

        function logout() { localStorage.removeItem('activeSession'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
